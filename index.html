<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zeamistrap</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #000000;
    --ink: #f4f5f7;
    --ink-dim: #9a9ea6;
    --line: #34363b;
    --steel: #d9dbe0;
    --font: "Chakra Petch", "Hiragino Sans", "Yu Gothic", "Noto Sans JP", system-ui, sans-serif;
    --cut: 14px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { background: var(--bg); }
  body {
    min-height: 100vh;
    min-height: 100dvh;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font);
    line-height: 1.6;
    display: flex;
    flex-direction: column;
    overflow-x: hidden;
  }

  .hero {
    flex: 1;
    width: 100%;
    max-width: 1240px;
    margin: 0 auto;
    padding: clamp(24px, 5vw, 72px) clamp(20px, 5vw, 56px);
    display: grid;
    grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr);
    align-items: center;
    gap: clamp(16px, 4vw, 64px);
  }

  .copy { position: relative; z-index: 2; }
  h1 {
    font-size: clamp(2.8rem, 6.2vw, 5.4rem);
    font-weight: 700;
    line-height: 0.95;
    letter-spacing: -0.02em;
    color: var(--ink);
  }
  .lede {
    margin-top: clamp(18px, 2.4vw, 28px);
    max-width: 30em;
    color: var(--ink-dim);
    font-size: clamp(1rem, 1.4vw, 1.15rem);
  }

  .actions {
    margin-top: clamp(28px, 4vw, 44px);
    display: flex;
    flex-wrap: wrap;
    gap: 14px;
  }

  .btn {
    --bw: 1px;
    position: relative;
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 15px 26px;
    font: 600 1rem/1 var(--font);
    letter-spacing: 0.02em;
    color: var(--ink);
    text-decoration: none;
    background: var(--line);
    clip-path: polygon(var(--cut) 0, 100% 0, 100% calc(100% - var(--cut)), calc(100% - var(--cut)) 100%, 0 100%, 0 var(--cut));
    transition: background-color .18s ease, transform .18s ease;
    cursor: pointer;
  }
  .btn::before {
    content: "";
    position: absolute;
    inset: var(--bw);
    background: var(--bg);
    clip-path: polygon(calc(var(--cut) - 0.6px) 0, 100% 0, 100% calc(100% - var(--cut) + 0.6px), calc(100% - var(--cut) + 0.6px) 100%, 0 100%, 0 calc(var(--cut) - 0.6px));
    transition: background-color .18s ease;
  }
  .btn > * { position: relative; }
  .btn svg { width: 20px; height: 20px; flex: none; fill: currentColor; }
  .btn:hover { background: var(--ink); transform: translateY(-2px); }
  .btn:hover::before { background: #14151a; }
  .btn:active { transform: translateY(0); }

  .btn--primary { background: var(--ink); color: #000; padding: 15px 30px; }
  .btn--primary::before { background: var(--ink); }
  .btn--primary:hover { background: var(--steel); }
  .btn--primary:hover::before { background: var(--steel); }

  .btn:focus-visible { outline: none; background: #fff; transform: translateY(-2px); }
  .btn:focus-visible::before { --bw: 3px; inset: 3px; background: #14151a; }
  .btn--primary:focus-visible::before { background: var(--ink); box-shadow: inset 0 0 0 2px #000; }

  .stage {
    position: relative;
    display: grid;
    place-items: center;
    perspective: 1100px;
    aspect-ratio: 1 / 1;
    width: 100%;
    max-width: 640px;
    justify-self: end;
  }
  .stage::before {
    content: "";
    position: absolute;
    inset: 8%;
    background: radial-gradient(closest-side, rgba(220, 226, 240, .06), rgba(220, 226, 240, 0) 100%);
    filter: blur(20px);
  }
  .logo {
    position: relative;
    width: 100%;
    height: auto;
    display: block;
    mix-blend-mode: lighten;
    transform: rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg));
    transition: transform .25s ease-out;
    will-change: transform;
    animation: arrive 1.1s cubic-bezier(.2,.8,.2,1) both;
    -webkit-user-drag: none;
    user-select: none;
  }
  @keyframes arrive {
    from { opacity: 0; transform: rotate(-6deg) scale(.94); }
    to   { opacity: 1; transform: rotate(0) scale(1); }
  }

  footer {
    max-width: 1240px;
    width: 100%;
    margin: 0 auto;
    padding: 0 clamp(20px, 5vw, 56px) 30px;
    color: var(--ink-dim);
    font-size: .875rem;
  }
  footer p { padding-top: 20px; border-top: 1px solid var(--line); }

  @media (max-width: 820px) {
    .hero { grid-template-columns: 1fr; text-align: left; padding-top: 12px; }
    .stage { order: -1; max-width: 420px; justify-self: center; margin-bottom: -6%; }
    h1 { font-size: clamp(2.6rem, 14vw, 4.5rem); }
  }
  @media (max-width: 420px) {
    .btn { flex: 1 1 100%; justify-content: center; }
  }
  @media (prefers-reduced-motion: reduce) {
    .logo { animation: none; transition: none; }
    .btn { transition: none; }
  }
</style>
</head>

<script>
  (function () {
    var stage = document.getElementById('stage');
    var logo = document.getElementById('logo');
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    if (!window.matchMedia('(hover: hover)').matches) return;

    logo.addEventListener('animationend', function () { logo.style.animation = 'none'; });

    document.addEventListener('pointermove', function (e) {
      var r = stage.getBoundingClientRect();
      var cx = r.left + r.width / 2, cy = r.top + r.height / 2;
      var dx = Math.max(-1, Math.min(1, (e.clientX - cx) / (window.innerWidth / 2)));
      var dy = Math.max(-1, Math.min(1, (e.clientY - cy) / (window.innerHeight / 2)));
      logo.style.setProperty('--ry', (dx * 14).toFixed(2) + 'deg');
      logo.style.setProperty('--rx', (-dy * 10).toFixed(2) + 'deg');
    });
    document.addEventListener('pointerleave', function () {
      logo.style.setProperty('--rx', '0deg');
      logo.style.setProperty('--ry', '0deg');
    });
  })();
</script>
